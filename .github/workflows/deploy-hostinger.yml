name: Deploy Automático para Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy para Servidor Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v4

      - name: 2. Configurar Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 3. Instalar Dependências
        run: npm ci

      - name: 4. Validação de Tipos e Lint
        run: npm run lint

      - name: 5. Compilar Projeto para Produção
        run: npm run build

      # Opção A: Deploy via FTP/FTPS Seguro (Padrão Web Hosting da Hostinger)
      # Configure os Secrets em: GitHub -> Settings -> Secrets and variables -> Actions
      - name: 6. Deploy para Hostinger (FTP/FTPS Seguro)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        if: env.HOSTINGER_FTP_SERVER != ''
        env:
          HOSTINGER_FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          server-dir: ${{ secrets.HOSTINGER_FTP_REMOTE_DIR || 'public_html/' }}
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .env
            .env.example
            README.md
            HOSTINGER_DEPLOYMENT_GUIDE.md

      # Opção B: Deploy via SSH / Rsync (Se tiver Hostinger Cloud ou VPS)
      - name: 6b. Deploy via SSH Rsync (Hostinger VPS / Cloud)
        if: env.HOSTINGER_SSH_HOST != ''
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
        uses: easingthemes/ssh-deploy@v5.0.3
        with:
          SSH_PRIVATE_KEY: ${{ secrets.HOSTINGER_SSH_PRIVATE_KEY }}
          REMOTE_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          REMOTE_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          TARGET: ${{ secrets.HOSTINGER_SSH_TARGET_DIR || '/var/www/sobrevivente' }}
          EXCLUDE: "/.git/, /node_modules/, /.github/, /.env"
          SCRIPT_AFTER: |
            echo "Reiniciando servidor de produção..."
            npm install --production
            pm2 restart sobrevivente || pm2 start server.js --name sobrevivente
